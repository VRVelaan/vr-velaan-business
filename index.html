<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VR Velaan Procurement Decision</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>🥥 VR Velaan</h1>
<h2>Procurement Decision</h2>

<label>Kangeyam Husked Coconut Rate (₹/Ton)</label>
<input type="number" id="tonRate" placeholder="Enter today's rate">

<label>Average Coconut Weight (grams)</label>
<input type="number" id="weight" value="390">

<button onclick="calculate()">Calculate</button>

<div class="result">

<h3>Results</h3>

<p>Market Value / Coconut</p>
<h2 id="marketValue">₹0.00</h2>

<p>Transport Cost / Coconut</p>
<h2 id="transportCost">₹0.00</h2>

<p>Loading Cost / Coconut</p>
<h2 id="loadingCost">₹0.00</h2>

<p>Misc Cost / Coconut</p>
<h2 id="miscCost">₹0.00</h2>

<p>Dehusking Labour / Coconut</p>
<h2 id="labourCost">₹0.00</h2>

<hr>

<p><b>Maximum Buying Price (No Profit)</b></p>
<h1 id="buyPrice" style="color:green;">₹0.00</h1>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
