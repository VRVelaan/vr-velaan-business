<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Velaan Coconut Procurement</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🥥 VR Velaan Coconut Procurement</h1>

        <h2>Rate Calculator</h2>

        <label>Number of Coconuts</label>

        <label>Rate per Coconut (₹)</label>
        <input type="number" id="rate" placeholder="Enter rate">

        <button onclick="calculate()">Calculate Amount</button>

        <h2 id="result">Total: ₹0</h2>
    </div>

    <script src="script.js"></script>

</body>
</html>
